<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TNC Admin · Tech N Chill</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.6fr);
      gap: 16px;
    }
    .admin-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .admin-section-body {
      font-size: 12px;
    }
    .admin-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .admin-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 6px 8px;
      border-radius: 10px;
      background: rgba(5, 3, 20, 0.85);
      border: 1px solid rgba(15, 23, 42, 0.8);
      transition: border-color 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
    }
    .admin-row:hover {
      border-color: rgba(76, 201, 240, 0.7);
      box-shadow: 0 0 14px rgba(76, 201, 240, 0.55);
      transform: translateY(-1px);
    }
    .admin-row-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .admin-row-title {
      font-size: 13px;
    }
    .admin-row-meta {
      font-size: 11px;
      color: var(--text-muted);
    }
    .admin-row-tags {
      font-size: 10px;
      color: #f9a8d4;
    }
    .admin-row-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
      font-size: 11px;
    }
    .admin-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      font-size: 11px;
    }
    .admin-calendar-dayname {
      text-align: center;
      color: var(--text-muted);
    }
    .admin-calendar-cell {
      min-height: 64px;
      border-radius: 10px;
      padding: 4px 6px;
      background: rgba(5, 3, 20, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.35);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: border-color 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
    }
    .admin-calendar-cell:hover {
      border-color: rgba(247, 37, 133, 0.7);
      box-shadow: 0 0 14px rgba(247, 37, 133, 0.5);
      transform: translateY(-1px);
    }
    .admin-calendar-daylabel {
      font-size: 11px;
      color: var(--text-muted);
    }
    .admin-calendar-pill {
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 999px;
      background: rgba(247, 37, 133, 0.25);
      border: 1px solid rgba(247, 37, 133, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .admin-summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }
    .admin-summary-card {
      border-radius: 12px;
      padding: 8px 10px;
      background: rgba(5, 3, 20, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.4);
    }
    .admin-summary-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .admin-summary-value {
      font-size: 14px;
      font-weight: 600;
    }
    .admin-finance-lists {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .admin-finance-panel {
      border-radius: 12px;
      padding: 8px 10px;
      background: rgba(3, 1, 15, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.35);
      font-size: 11px;
    }
    .admin-finance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.25);
    }
    .admin-finance-row:last-child {
      border-bottom: none;
    }
    .admin-finance-label {
      max-width: 70%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .admin-finance-amt {
      margin-right: 4px;
    }
    @media (max-width: 900px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }
      .admin-finance-lists {
        grid-template-columns: 1fr;
      }
      .admin-summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <div id="app">

    <header class="tnc-header">
      <div class="logo-block">
        <div class="logo-orb"></div>
        <div class="logo-text">
          <h1>Admin Panel</h1>
          <p>Tech N Chill Control Center</p>
        </div>
      </div>
    </header>

    <main class="tnc-main admin-grid">

      <div class="admin-column">
        <!-- Calendar -->
        <section class="panel">
          <div class="panel-header">
            <div>
              <h2>Show Calendar</h2>
              <p>Upcoming events & cosplay nights</p>
            </div>
            <button id="add-event-btn" class="btn-ghost btn-ghost-sm">Add Show</button>
          </div>
          <div class="admin-section-body" id="calendar-header"></div>
          <div class="admin-calendar-grid" id="calendar-grid"></div>
        </section>

        <!-- Promoters -->
        <section class="panel">
          <div class="panel-header">
            <div>
              <h2>Promoters</h2>
              <p>Bookings & partnerships</p>
            </div>
            <button id="add-promoter-btn" class="btn-ghost btn-ghost-sm">Add Promoter</button>
          </div>
          <div class="admin-section-body">
            <div class="admin-list" id="promoters-list"></div>
          </div>
        </section>
      </div>

      <div class="admin-column">
        <!-- Employees -->
        <section class="panel">
          <div class="panel-header">
            <div>
              <h2>Employees</h2>
              <p>Staff roster & roles</p>
            </div>
            <button id="add-employee-btn" class="btn-ghost btn-ghost-sm">Add Employee</button>
          </div>
          <div class="admin-section-body">
            <div class="admin-list" id="employees-list"></div>
          </div>
        </section>

        <!-- Finances -->
        <section class="panel">
          <div class="panel-header">
            <div>
              <h2>Finances</h2>
              <p>Revenue · Payouts · Expenses</p>
            </div>
            <div>
              <button data-type="revenue" class="btn-ghost btn-ghost-sm admin-add-finance">Add Revenue</button>
              <button data-type="expense" class="btn-ghost btn-ghost-sm admin-add-finance">Add Expense</button>
              <button data-type="payout" class="btn-ghost btn-ghost-sm admin-add-finance">Add Payout</button>
            </div>
          </div>
          <div class="admin-section-body">
            <div class="admin-summary-grid" id="finance-summary"></div>
            <div class="admin-finance-lists">
              <div class="admin-finance-panel">
                <div class="admin-summary-label">Revenue Entries</div>
                <div id="finance-revenue-list"></div>
              </div>
              <div class="admin-finance-panel">
                <div class="admin-summary-label">Expenses</div>
                <div id="finance-expense-list"></div>
              </div>
              <div class="admin-finance-panel">
                <div class="admin-summary-label">Payouts</div>
                <div id="finance-payout-list"></div>
              </div>
            </div>
          </div>
        </section>
      </div>

    </main>

  </div>

  <script src="admin.js"></script>
</body>
</html>
