<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TNC Admin · Tech N Chill</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    .admin-preview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 16px;
    }

    .preview-box {
      background: rgba(5,3,20,0.85);
      border: 1px solid rgba(148,163,184,0.35);
      border-radius: 14px;
      padding: 14px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.15s ease;
    }

    .preview-box:hover {
      border-color: rgba(76,201,240,0.7);
      box-shadow: 0 0 14px rgba(76,201,240,0.5);
      transform: translateY(-2px);
    }

    .preview-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .preview-meta {
      font-size: 13px;
      opacity: 0.75;
      margin-bottom: 6px;
    }

    .preview-link {
      margin-top: auto;
      text-align: right;
    }

    .preview-link a {
      font-size: 12px;
      color: #4ade80;
      text-decoration: underline;
      cursor: pointer;
    }

    /* Dancing characters */
    #dancer-strip {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      pointer-events: none;
      overflow: hidden;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 40px;
      padding-left: 20px;
      animation: scrollDance 12s linear infinite;
      font-size: 48px;
    }

    @keyframes scrollDance {
      0% { transform: translateX(0); }
      100% { transform: translateX(-120%); }
    }
  </style>
</head>

<body>
  <div id="app">

    <header class="tnc-header">
      <div class="logo-block">
        <div class="logo-orb"></div>
        <div class="logo-text">
          <h1>Admin Panel</h1>
          <p>Tech N Chill Control Center</p>
        </div>
      </div>
    </header>

    <main class="tnc-main">

      <section class="panel">
        <div class="panel-header">
          <div>
            <h2>Dashboard Overview</h2>
            <p>Quick previews of all modules</p>
          </div>
        </div>

        <div class="admin-preview-grid">

          <!-- CALENDAR PREVIEW -->
          <div class="preview-box">
            <div>
              <div class="preview-title">Show Calendar</div>
              <div class="preview-meta" id="preview-calendar-meta">Loading…</div>
            </div>
            <div class="preview-link">
              <a href="calendar.html">Open Calendar →</a>
            </div>
          </div>

          <!-- EMPLOYEES PREVIEW -->
          <div class="preview-box">
            <div>
              <div class="preview-title">Employees</div>
              <div class="preview-meta" id="preview-employees-meta">Loading…</div>
            </div>
            <div class="preview-link">
              <a href="employees.html">Open Employees →</a>
            </div>
          </div>

          <!-- PROMOTERS PREVIEW -->
          <div class="preview-box">
            <div>
              <div class="preview-title">Promoters</div>
              <div class="preview-meta" id="preview-promoters-meta">Loading…</div>
            </div>
            <div class="preview-link">
              <a href="promoters.html">Open Promoters →</a>
            </div>
          </div>

          <!-- FINANCES PREVIEW -->
          <div class="preview-box">
            <div>
              <div class="preview-title">Finances</div>
              <div class="preview-meta" id="preview-finances-meta">Loading…</div>
            </div>
            <div class="preview-link">
              <a href="finances.html">Open Finances →</a>
            </div>
          </div>

        </div>
      </section>

    </main>

  </div>

  <!-- Dancing characters -->
  <div id="dancer-strip">🤡 🧙‍♀️ 🧌 🤡 🧙‍♀️ 🧌 🤡 🧙‍♀️ 🧌</div>

  <script src="admin.js"></script>

  <script>
    window.addEventListener("load", () => {
      adminLoad();

      // Calendar preview
      const nextEvent = adminEvents[0];
      document.getElementById("preview-calendar-meta").textContent =
        nextEvent
          ? `${nextEvent.title} · ${adminFormatDate(nextEvent.date)}`
          : "No events scheduled";

      // Employees preview
      document.getElementById("preview-employees-meta").textContent =
        adminEmployees.length
          ? `${adminEmployees.length} staff members`
          : "No employees added";

      // Promoters preview
      document.getElementById("preview-promoters-meta").textContent =
        adminPromoters.length
          ? `${adminPromoters.length} promoters`
          : "No promoters added";

      // Finances preview
      const totalRev = adminFinances.revenue.reduce((s, r) => s + r.amount, 0);
      const totalExp = adminFinances.expenses.reduce((s, r) => s + r.amount, 0);
      const totalPay = adminFinances.payouts.reduce((s, r) => s + r.amount, 0);
      const net = totalRev - totalExp - totalPay;

      document.getElementById("preview-finances-meta").textContent =
        `Net: $${net.toFixed(2)}`;
    });
  </script>

</body>
</html>
