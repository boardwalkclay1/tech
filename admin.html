<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TNC Admin · Tech N Chill</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="app">

    <header class="tnc-header">
      <div class="logo-block">
        <div class="logo-orb"></div>
        <div class="logo-text">
          <h1>Admin Panel</h1>
          <p>Tech N Chill Control Center</p>
        </div>
      </div>
    </header>

    <main class="tnc-main">

      <!-- Calendar -->
      <div class="panel">
        <div class="panel-header">
          <h2>Show Calendar</h2>
          <p>Upcoming events & cosplay nights</p>
        </div>
        <div id="calendar"></div>
      </div>

      <!-- Employees -->
      <div class="panel">
        <div class="panel-header">
          <h2>Employees</h2>
          <p>Staff roster & roles</p>
        </div>
        <div id="employees"></div>
      </div>

      <!-- Promoters -->
      <div class="panel">
        <div class="panel-header">
          <h2>Promoters</h2>
          <p>Bookings & partnerships</p>
        </div>
        <div id="promoters"></div>
      </div>

      <!-- Finances -->
      <div class="panel">
        <div class="panel-header">
          <h2>Finances</h2>
          <p>Revenue · Payouts · Expenses</p>
        </div>
        <div id="finances"></div>
      </div>

    </main>

  </div>

  <script src="admin.js"></script>
</body>
</html>
